name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install fastapi uvicorn pydantic sentence-transformers pytest httpx faiss-cpu requests

      - name: Build FAISS index
        run: |
          python -m app.ingest
          python -m app.search

      - name: Run evaluation quality gate
        run: |
          python -c "
          from app.evaluate import evaluate_retrieval
          report = evaluate_retrieval(top_k=3)
          print(f'Hit rate: {report[\"hit_rate\"]:.0%} ({report[\"correct\"]}/{report[\"total\"]})')
          assert report['hit_rate'] >= 0.8, f'Retrieval quality too low: {report[\"hit_rate\"]:.0%}'
          print('Quality gate passed')
          "
